<style>

  .rating button.selected { background: #22C55E; color: white; border-color: #22C55E; }

    animation: ratingFlash 100ms ease-out;
    box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.35);
  }
  @keyframes ratingFlash {
    0%   { transform: scale(1);   box-shadow: 0 0 0 0    rgba(34, 197, 94, 0.55); }
    40%  { transform: scale(1.08); box-shadow: 0 0 0 8px rgba(34, 197, 94, 0.30); }

  }
  .rating button .num { font-size: 18px; font-weight: 700; }

  .nav {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-top: 22px;
    flex-wrap: wrap;
  }

    font-size: 14px;
    font-weight: 500;
    color: #3f3f46;

  .nav button.primary { background: #1C1C1C; color: white; border-color: #1C1C1C; }
  .nav button.primary:hover:not(:disabled) { background: #333333; }
  .nav button:disabled { opacity: 0.4; cursor: not-allowed; }
  .nav .right-group { display: flex; gap: 10px; flex-wrap: wrap; }

  /* Picker */
  .picker-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 28px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .picker-header h2 { font-size: 24px; font-weight: 600; }
  .picker-header .lead { font-size: 14px; color: #52525b; margin-top: 4px; }
  .lang-toggle {

    font-weight: 500;
    color: #52525b;
    transition: all 0.12s;
  }
  .lang-toggle button:first-child { border-right: 1px solid #e4e4e7; }
  .lang-toggle button.active { background: #1C1C1C; color: white; }
  .lang-toggle button:hover:not(.active) { background: #f4f4f5; }

    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 28px;
  }

    padding: 20px;

    flex-direction: column;
    gap: 10px;

  .level-card:hover { border-color: #22C55E; box-shadow: 0 0 0 3px rgba(37,99,235,0.08); }
  .level-card-num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 16px;
  }
  .level-card-num.l1 { background: #e4e4e7; color: #3f3f46; }
  .level-card-num.l2 { background: #fef3c7; color: #92400e; }
  .level-card-num.l3 { background: #F0FDF4; color: #166534; }
  .level-card-title { font-weight: 600; font-size: 15px; line-height: 1.3; color: #18181b; }
  .level-card-desc { font-size: 13px; color: #52525b; line-height: 1.4; flex: 1; }
  .level-card-stats {
    display: flex;
    gap: 10px;
    font-size: 12px;
    color: #71717a;
    margin-top: 4px;
    flex-wrap: wrap;
  }
  .level-card-stat { display: flex; align-items: center; gap: 4px; }
  .level-card-btn {
    margin-top: 4px;
    padding: 8px 14px;
    background: #1C1C1C;
    color: white;
    border: none;
    border-radius: 7px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.12s;
    text-align: center;
  }
  .level-card-btn:hover { background: #333333; }

  .picker-import {
    padding-top: 20px;
    border-top: 1px solid #e4e4e7;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .picker-import span { font-size: 13px; color: #71717a; }
  .picker-import button {
    padding: 7px 14px;
    font-size: 13px;
    border-radius: 7px;
    border: 1px solid #d4d4d8;
    background: white;
    cursor: pointer;
    color: #3f3f46;
  }
  .picker-import button:hover { background: #f4f4f5; }

  /* Intro */
  .intro h2 { font-size: 24px; margin-bottom: 8px; }
  .intro .lead { color: #52525b; margin-bottom: 20px; }
  .intro h3 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #71717a;
    margin: 20px 0 10px;
    font-weight: 600;
  }

  .scale-rows { display: grid; gap: 6px; font-size: 14px; }
  .scale-row {
    display: grid;
    grid-template-columns: 28px 1fr;
    gap: 12px;
    padding: 8px 12px;
    background: #fafafa;
    border-radius: 6px;
    align-items: baseline;
  }
  .scale-row .n {
    font-weight: 700;
    color: #22C55E;
    font-variant-numeric: tabular-nums;
  }
  .level-rows { display: grid; gap: 6px; font-size: 14px; }
  .level-row {
    padding: 8px 12px;
    border-radius: 6px;
    display: grid;
    grid-template-columns: 36px 1fr;
    gap: 12px;
    align-items: baseline;
  }
  .level-row.r1 { background: #F0FDF4; color: #166534; }
  .level-row.r2 { background: #fef3c7; color: #78350f; }
  .level-row.r3 { background: #e4e4e7; color: #27272a; }
  .level-row.default { background: #e4e4e7; color: #27272a; }

  /* Summary */
  .summary h2 { font-size: 24px; margin-bottom: 8px; }
  .summary .lead { color: #52525b; margin-bottom: 20px; }
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 24px;
  }
  .stats.stats-4 { grid-template-columns: repeat(4, 1fr); }
  .stat {
    background: #fafafa;
    border-radius: 8px;
    padding: 14px;
    text-align: center;
  }
  .stat-value {
    font-size: 26px;
    font-weight: 700;
    color: #22C55E;
    font-variant-numeric: tabular-nums;
  }
  .stat-value.red { color: #dc2626; }
  .stat-value.green { color: #16a34a; }
  .stat-label {
    font-size: 11px;
    color: #71717a;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-top: 3px;
  }
  .lesson-bar { margin-bottom: 14px; }
  .lesson-bar-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 14px;
    margin-bottom: 5px;
  }
  .lesson-bar-head .name { color: #27272a; }
  .lesson-bar-head .val { color: #71717a; font-variant-numeric: tabular-nums; font-size: 13px; }
  .lesson-bar-track {
    height: 10px;
    background: #e4e4e7;
    border-radius: 5px;
    overflow: hidden;
    position: relative;
  }
  .lesson-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #22C55E, #4ADE80);
    border-radius: 5px;
    transition: width 0.4s ease;
  }
  .lesson-bar-expected {
    position: absolute;
    top: -2px;
    bottom: -2px;
    width: 2px;
    background: #18181b;
  }
  .gap-section { margin-top: 28px; }
  .gap-section h3 {
    font-size: 15px;
    margin-bottom: 10px;
    color: #18181b;
  }
  .gap-item {
    padding: 10px 14px;
    background: #fef2f2;
    border-left: 3px solid #dc2626;
    border-radius: 4px;
    margin-bottom: 6px;
    font-size: 14px;
  }
  .gap-item .g-id { font-weight: 600; color: #991b1b; margin-right: 6px; }
  .gap-item .g-title { color: #3f3f46; }
  .gap-item .g-meta {
    font-size: 12px;
    color: #71717a;
    margin-top: 3px;
  }
  .strong-item {
    padding: 10px 14px;
    background: #f0fdf4;
    border-left: 3px solid #16a34a;
    border-radius: 4px;
    margin-bottom: 6px;
    font-size: 14px;
  }
  .strong-item .g-id { font-weight: 600; color: #166534; margin-right: 6px; }
  .strong-item .g-title { color: #3f3f46; }

  .report-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 24px;
    padding-top: 24px;
    border-top: 1px solid #e4e4e7;
  }
  .report-actions button {
    padding: 10px 16px;
    border-radius: 8px;
    border: 1px solid #1C1C1C;
    background: #1C1C1C;
    color: white;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
  }
  .report-actions button:hover { background: #333333; }
  .report-actions button.secondary {
    background: white;
    color: #22C55E;
    border-color: #22C55E;
  }
  .report-actions button.secondary:hover { background: #F0FDF4; }
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 200;
    padding: 16px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s;
  }
  .modal-overlay.show { opacity: 1; pointer-events: auto; }
  .modal-box {
    background: white;
    border-radius: 12px;
    padding: 24px;
    max-width: 380px;
    width: 100%;
    box-shadow: 0 8px 32px rgba(0,0,0,0.18);
    transform: translateY(8px);
    transition: transform 0.15s;
  }
  .modal-overlay.show .modal-box { transform: translateY(0); }
  .modal-box p { font-size: 15px; color: #18181b; margin-bottom: 20px; line-height: 1.5; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .modal-actions button {
    padding: 8px 16px;
    border-radius: 7px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid #e4e4e7;
    background: white;
    color: #3f3f46;
  }
  .modal-actions button:hover { background: #f4f4f5; }
  .modal-actions button.danger { background: #dc2626; color: white; border-color: #dc2626; }
  .modal-actions button.danger:hover { background: #b91c1c; }

  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #18181b;
    color: white;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 13px;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
    z-index: 100;
  }
  .toast.show { opacity: 1; }

  .error-box {
    background: #fef2f2;
    border: 1px solid #fecaca;
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 16px;
    font-size: 13px;
    color: #991b1b;
  }

  .footnote {
    font-size: 12px;
    color: #a1a1aa;
    margin-top: 24px;
    text-align: center;
  }

  @media (max-width: 700px) {
    .level-cards { grid-template-columns: 1fr; }
  }
  @media (max-width: 600px) {
    .stats, .stats.stats-4 { grid-template-columns: 1fr 1fr; }
    .rating { grid-template-columns: repeat(5, 1fr); gap: 4px; }
    .rating button { font-size: 10px; min-height: 80px; padding: 8px 2px; }
    .card { padding: 20px; }
  }
</style>
</head>
<body>
<div class="container" id="app"></div>
<div class="toast" id="toast"></div>
<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box">
    <p id="modal-msg"></p>
    <div class="modal-actions">
      <button id="modal-cancel">Cancel</button>
      <button id="modal-confirm" class="danger">Reset</button>
    </div>
  </div>
</div>

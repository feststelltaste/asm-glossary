  md += '|---|---|\n';
  md += '| Ø ' + (isDE ? 'Bewertung' : 'Rating') + ' | ' + (avg ? avg.toFixed(1) : '—') + ' / ' + Math.max(...SCALE.map(s => s.value)) + ' |\n';
  md += '| ' + (isDE ? 'Stärken (Bewertung ≥ 4)' : 'Strengths (rating ≥ 4)') + ' | ' + strengths.length + ' |\n';
  md += '| ' + (isDE ? 'Lücken gegenüber R-Level' : 'Gaps vs. R-level') + ' | ' + gaps.length + ' |\n';
  if (hasEffort) {
    md += '| ' + (isDE ? 'Gesamt-Lernaufwand' : 'Total learning effort') + ' | ~' + formatHours(totalHours) + ' |\n';
    md += '| ' + (isDE ? 'Aufwand für Lücken' : 'Effort to close gaps') + ' | ~' + formatHours(gapHours) + ' |\n';
  }
  md += '\n';

  if (gaps.length > 0) {
    md += '## ' + (isDE ? 'Entwicklungsfelder' : 'Development areas') + '\n\n';
    gaps.sort((a, b) => (state.ratings[a.id] - EXPECTED[a.level]) - (state.ratings[b.id] - EXPECTED[b.level]));
    gaps.forEach(lg => {
      md += '### ' + lg.id + ': ' + lg.title + '\n';
      md += '- **Level:** ' + lg.level + ' (' + (isDE ? 'erwartet' : 'expected') + ' ≥ ' + EXPECTED[lg.level] + ')\n';
      md += '- **' + (isDE ? 'Aktuelle Bewertung' : 'Current rating') + ':** ' + state.ratings[lg.id] + '\n';
      if (lg.effortHours != null) md += '- **' + (isDE ? 'Lernaufwand' : 'Learning effort') + ':** ~' + formatHours(lg.effortHours) + '\n';
      md += '\n';
    });
  }

  if (strengths.length > 0) {
    md += '## ' + (isDE ? 'Stärken' : 'Strengths') + '\n\n';
    strengths.sort((a, b) => state.ratings[b.id] - state.ratings[a.id]);
    strengths.forEach(lg => {
      md += '- **' + lg.id + '** — ' + lg.title + ' (' + state.ratings[lg.id] + ')\n';
    });
    md += '\n';
  }

  md += '---\n\n';
  md += '*' + (isDE ? 'Generiert am' : 'Generated on') + ' ' + datetime + ' · ' + (isDE ? 'Bewertungsskala' : 'Rating scale') + ' 1–' + Math.max(...SCALE.map(s => s.value)) + '*\n';

  return md;
}

function downloadMarkdownReport() {
  const md = generateMarkdownReport();
  const name = (currentCurriculum.meta.name || 'assessment').toLowerCase().replace(/\s+/g, '-');
  const date = new Date().toISOString().slice(0, 10);
  const blob = new Blob([md], {type: 'text/markdown'});
  downloadBlob(blob, name + '-assessment-' + date + '.md');
  toast(currentCurriculum.meta.language === 'de' ? 'Markdown-Report heruntergeladen' : 'Markdown report downloaded');
}

async function copyMarkdownReport() {
  const md = generateMarkdownReport();
  try {
    await navigator.clipboard.writeText(md);
    toast(currentCurriculum.meta.language === 'de' ? 'In Zwischenablage kopiert' : 'Copied to clipboard');
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = md;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); toast('Copied to clipboard'); }
    catch (e2) { showError('Copy failed — please download the report'); }
    document.body.removeChild(ta);
  }
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* =============================================================
   TOAST + ERROR
   ============================================================= */
function showModal(msg, confirmLabel, onConfirm) {
  const overlay = document.getElementById('modal-overlay');
  document.getElementById('modal-msg').textContent = msg;
  document.getElementById('modal-confirm').textContent = confirmLabel;
  overlay.classList.add('show');
  const cancel = document.getElementById('modal-cancel');
  const confirm = document.getElementById('modal-confirm');
  const close = () => { overlay.classList.remove('show'); };
  const onOk = () => { close(); onConfirm(); };
  cancel.onclick = close;
  confirm.onclick = onOk;
  overlay.onclick = (e) => { if (e.target === overlay) close(); };
}

let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

let errorMsg = null;
function showError(msg) {
  errorMsg = msg;
  render();
  setTimeout(() => { errorMsg = null; render(); }, 8000);
}

/* =============================================================
   RENDERING — HELPERS
   ============================================================= */
function formatHours(h) {
  if (h == null) return '';
  const mins = Math.round(h * 60);
  if (mins < 120) return mins + ' min';
  if (h === Math.floor(h)) return h + 'h';
  return h.toFixed(1) + 'h';
}

function sumEffort(lgs) {
  return lgs.reduce((s, lg) => s + (lg.effortHours || 0), 0);
}

function el(tag, attrs = {}, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'html') e.innerHTML = v;
    else if (typeof v === 'boolean') { if (v) e.setAttribute(k, ''); }
    else e.setAttribute(k, v);
  }
  for (const c of children) {
    if (c == null || c === false) continue;
    e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return e;
}

function levelBadgeClass(code) {
  const c = code.toLowerCase();
  if (c === 'r1' || c === 'r2' || c === 'r3') return 'badge-' + c;
  return 'badge-default';
}

function levelRowClass(code) {
  const c = code.toLowerCase();
  if (c === 'r1' || c === 'r2' || c === 'r3') return c;
  return 'default';
}

/* =============================================================
   RENDERING — SUMMARY
   ============================================================= */
function renderSummary() {
  const answered = Object.entries(state.ratings);
  const total = answered.length;
  const avg = total > 0 ? (answered.reduce((s, [, v]) => s + v, 0) / total).toFixed(1) : '—';
  const gaps = LG.filter(lg => state.ratings[lg.id] !== undefined && state.ratings[lg.id] < EXPECTED[lg.level]);
  const strengths = LG.filter(lg => state.ratings[lg.id] !== undefined && state.ratings[lg.id] >= 4);
  const isDE = currentCurriculum.meta.language === 'de';

  const lessons = {};
  LG.forEach(lg => {
    if (!lessons[lg.lesson]) lessons[lg.lesson] = {title: lg.lessonTitle, ratings: [], expected: []};
    if (state.ratings[lg.id] !== undefined) {
      lessons[lg.lesson].ratings.push(state.ratings[lg.id]);
      lessons[lg.lesson].expected.push(EXPECTED[lg.level]);
    }
  });

  const maxVal = Math.max(...SCALE.map(s => s.value));

  const topbar = el('div', {class: 'topbar'},
    el('div', {},
      el('h1', {}, isDE ? 'Auswertung' : 'Results'),
      el('div', {class: 'sub'}, currentCurriculum.meta.name)
    ),
    el('div', {class: 'counter'}, total + '/' + LG.length + (isDE ? ' bewertet' : ' rated'))
  );

  const gapHours = gaps.reduce((s, lg) => s + (lg.effortHours || 0), 0);
  const totalHours = sumEffort(LG);

  const statsEl = el('div', {class: 'stats stats-4'},
    el('div', {class: 'stat'},
      el('div', {class: 'stat-value'}, String(avg)),
      el('div', {class: 'stat-label'}, 'Ø ' + (isDE ? 'Bewertung' : 'Rating'))
    ),
    el('div', {class: 'stat'},
      el('div', {class: 'stat-value green'}, String(strengths.length)),
      el('div', {class: 'stat-label'}, isDE ? 'Stärken (≥4)' : 'Strengths (≥4)')
    ),
    el('div', {class: 'stat'},
      el('div', {class: 'stat-value red'}, String(gaps.length)),
      el('div', {class: 'stat-label'}, isDE ? 'Gaps ggü. R-Level' : 'Gaps vs. R-level')
    ),
    totalHours > 0 ? el('div', {class: 'stat'},
      el('div', {class: 'stat-value red'}, '~' + formatHours(gapHours)),
      el('div', {class: 'stat-label'}, isDE ? 'Aufwand für Lücken' : 'Effort for gaps')
    ) : null
  );

  const lessonBars = el('div', {},
    el('h3', {style: 'font-size:15px; margin:6px 0 14px; color:#18181b;'}, isDE ? 'Pro Lektion' : 'Per lesson'),
    ...Object.keys(lessons).sort((a, b) => Number(a) - Number(b)).map(num => {
      const data = lessons[num];
      if (data.ratings.length === 0) {
        return el('div', {class: 'lesson-bar'},
          el('div', {class: 'lesson-bar-head'},
            el('span', {class: 'name'}, (isDE ? 'Lektion ' : 'Lesson ') + num + ' — ' + data.title),
            el('span', {class: 'val'}, isDE ? 'keine Bewertungen' : 'no ratings')
          ),
          el('div', {class: 'lesson-bar-track'})
        );
      }
      const a = data.ratings.reduce((s, v) => s + v, 0) / data.ratings.length;
      const exp = data.expected.reduce((s, v) => s + v, 0) / data.expected.length;
      return el('div', {class: 'lesson-bar'},
        el('div', {class: 'lesson-bar-head'},
          el('span', {class: 'name'}, (isDE ? 'Lektion ' : 'Lesson ') + num + ' — ' + data.title),
          el('span', {class: 'val'}, 'Ø ' + a.toFixed(1) + ' (' + (isDE ? 'erwartet ' : 'expected ') + exp.toFixed(1) + ')')
        ),
        el('div', {class: 'lesson-bar-track'},
          el('div', {class: 'lesson-bar-fill', style: 'width:' + (a / maxVal * 100) + '%'}),
          el('div', {class: 'lesson-bar-expected', style: 'left:' + (exp / maxVal * 100) + '%', title: isDE ? 'Erwartetes Level' : 'Expected level'})
        )
      );
    })
  );

  const gapsEl = gaps.length > 0 ? el('div', {class: 'gap-section'},
    el('h3', {}, isDE ? 'Entwicklungsfelder (unter erwartetem Level)' : 'Development areas (below expected level)'),
    ...gaps
      .sort((a, b) => (state.ratings[a.id] - EXPECTED[a.level]) - (state.ratings[b.id] - EXPECTED[b.level]))
      .map(lg => el('div', {class: 'gap-item'},
        el('div', {},
          el('span', {class: 'g-id'}, lg.id),
          el('span', {class: 'g-title'}, lg.title)
        ),
        el('div', {class: 'g-meta'},
          'Level ' + lg.level + ' (' + (isDE ? 'erwartet' : 'expected') + ' ≥' + EXPECTED[lg.level] + ') · ' +
          (isDE ? 'aktuell: ' : 'current: ') + state.ratings[lg.id] +
          (lg.effortHours != null ? ' · ~' + formatHours(lg.effortHours) : '')
        )
      ))
  ) : null;

  const strengthsEl = strengths.length > 0 ? el('div', {class: 'gap-section'},
    el('h3', {}, isDE ? 'Stärken (≥4)' : 'Strengths (≥4)'),
    ...strengths.map(lg => el('div', {class: 'strong-item'},
      el('span', {class: 'g-id'}, lg.id),
      el('span', {class: 'g-title'}, lg.title)
    ))
  ) : null;

  const card = el('div', {class: 'card summary'},
    el('h2', {}, isDE ? 'Deine Auswertung' : 'Your results'),
    el('p', {class: 'lead'}, total < LG.length
      ? (isDE ? 'Noch ' : 'Still ') + (LG.length - total) + (isDE ? ' Themen offen.' : ' topics open.')
      : (isDE ? 'Alle ' + LG.length + ' Learning Goals bewertet.' : 'All ' + LG.length + ' learning goals rated.')),
    statsEl,
    lessonBars,
    gapsEl,
    strengthsEl,

    el('div', {class: 'report-actions'},
      el('button', {onClick: downloadMarkdownReport}, isDE ? 'Markdown-Report herunterladen' : 'Download Markdown report'),
      el('button', {class: 'secondary', onClick: copyMarkdownReport}, isDE ? 'In Zwischenablage kopieren' : 'Copy to clipboard')
    ),

    el('div', {class: 'nav'},
      el('button', {onClick: () => go('lg', 0)}, '← ' + (isDE ? 'Zurück zu den Themen' : 'Back to topics')),
      el('div', {class: 'right-group'},
        el('button', {onClick: () => go('picker')}, isDE ? 'Curriculum wechseln' : 'Change curriculum'),
        el('button', {onClick: resetRatings}, isDE ? 'Bewertungen zurücksetzen' : 'Reset ratings')
      )
    ),
    el('div', {class: 'footnote'}, currentCurriculum.meta.name + (currentCurriculum.meta.version ? ' ' + currentCurriculum.meta.version : '') + ' · Self-Assessment')
  );

  return el('div', {}, topbar, card);
}

/* =============================================================
   RENDER DISPATCHER
   ============================================================= */
function render() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  let content;
  if (state.view === 'picker' || !currentCurriculum) content = renderPicker();
  else if (state.view === 'intro') content = renderIntro();
  else if (state.view === 'lg') content = renderLG();
  else content = renderSummary();
  app.appendChild(content);
  window.scrollTo(0, 0);
}

/* =============================================================
   KEYBOARD SHORTCUTS (LG view only)
   ============================================================= */
function handleKeydown(e) {
  if (state.view !== 'lg') return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;

  const n = parseInt(e.key, 10);
  if (!isNaN(n) && n >= 1 && n <= SCALE.length) {
    e.preventDefault();
    const lg = LG[state.index];
    const value = SCALE[n - 1].value;
    state.ratings[lg.id] = value;
    save();

    const buttons = document.querySelectorAll('.rating button');
    const btn = buttons[n - 1];
    if (btn) {
      buttons.forEach(b => b.classList.remove('selected', 'flash'));
      btn.classList.add('selected', 'flash');
    }

    const targetIndex = state.index;
    setTimeout(() => {
      if (state.view !== 'lg' || state.index !== targetIndex) return;
      if (state.index < LG.length - 1) go('lg', state.index + 1);
      else go('summary');
    }, 100);
    return;
  }

  if (e.key === 'ArrowRight') {
    const lg = LG[state.index];
    if (state.ratings[lg.id] === undefined) return;
    e.preventDefault();
    if (state.index < LG.length - 1) go('lg', state.index + 1);
    else go('summary');
  } else if (e.key === 'ArrowLeft') {
    e.preventDefault();
    if (state.index === 0) go('intro');
    else go('lg', state.index - 1);
  }
}

/* =============================================================
   INIT
   ============================================================= */
document.addEventListener('keydown', handleKeydown);
load();
</script>
</body>
